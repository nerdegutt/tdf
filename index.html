<!DOCTYPE html>
<html lang="no" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tour de France 2026 – Reiseguide</title>
  <meta name="description" content="Reiseguide for en 18-dagers biltur gjennom Europa: Norge → Tyskland → Belgia → Frankrike → Spania og hjem. 7 land, 6200 km, mai 2026." />
  <link rel="canonical" href="https://tdf.offline.no/" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Tour de France 2026" />
  <meta property="og:title" content="Tour de France 2026 – Reiseguide" />
  <meta property="og:description" content="Reiseguide for en 18-dagers biltur gjennom Europa: Norge → Tyskland → Belgia → Frankrike → Spania og hjem. 7 land, 6200 km, mai 2026." />
  <meta property="og:url" content="https://tdf.offline.no/" />
  <meta property="og:locale" content="nb_NO" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Tour de France 2026 – Reiseguide" />
  <meta name="twitter:description" content="18 dager · 7 land · 6200 km. Reiseguide for en biltur gjennom Europa, mai 2026." />

  <script>if (localStorage.getItem('tdf-theme') === 'light') document.documentElement.classList.remove('dark')</script>
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen flex flex-col">

  <!-- Skip-lenke for tastaturnavigasjon -->
  <a href="#day-content" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:bg-blue-900 focus:text-white focus:px-4 focus:py-2 focus:rounded">Gå til hovedinnhold</a>

  <!-- Header -->
  <header class="bg-white text-stone-900">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3 hover:opacity-90 transition-opacity">
        <span class="text-2xl" aria-hidden="true">🚗</span>
        <div>
          <h1 class="text-lg font-bold leading-tight">Tour de France 2026</h1>
          <p class="text-stone-500 text-sm">13.–30. mai · Erlend & Bjørn Erik</p>
        </div>
      </a>
      <!-- Navigasjon-dropdown -->
      <div id="mobile-nav" class="hidden">
        <label for="day-select" class="sr-only">Velg side</label>
        <select id="day-select" class="bg-stone-100 text-stone-900 rounded px-2 py-1 text-sm">
        </select>
      </div>
    </div>
  </header>

  <!-- Aria-live region for navigasjonsannonsering -->
  <div id="nav-announcement" aria-live="polite" aria-atomic="true" class="sr-only"></div>

  <!-- Hovedinnhold -->
  <main id="app" class="flex-1">
    <!-- Oversikt-view -->
    <div id="view-overview" class="hidden">
      <div id="map-container" class="w-full h-[50vh] md:h-[60vh]" role="img" aria-label="Kart over reiseruten gjennom Europa"></div>
      <div class="max-w-7xl mx-auto px-4 py-8">
        <h2 class="text-2xl font-bold mb-2">18 dager · ca. 6 200 km · 7 land</h2>
        <p class="text-stone-500 mb-6">Rakkestad → Tyskland → Belgia → Normandie → Bretagne → Atlanterhavskysten → Baskerland → Languedoc → Provence → Burgund → Alsace → Mosel → Hjem</p>
        <div id="day-cards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </div>
    </div>

    <!-- Dag-view -->
    <div id="view-day" class="hidden">
      <!-- Dagkart (togglebart) -->
      <div id="day-map-wrapper" class="map-visible">
        <div>
          <div id="day-map-container" class="w-full h-[35vh] md:h-[40vh]" role="img" aria-label="Kart over dagens rute"></div>
        </div>
      </div>
      <div class="max-w-7xl mx-auto flex">
        <!-- Desktop sidebar -->
        <aside id="sidebar" class="hidden lg:block w-64 shrink-0 min-h-[calc(100vh-72px)] sticky top-0 overflow-y-auto" aria-label="Sidenavigasjon">
          <nav class="p-4">
            <ul id="sidebar-days" class="space-y-1"></ul>
          </nav>
        </aside>
        <!-- Daginnhold -->
        <div id="day-content" class="flex-1 min-w-0 px-4 py-6 lg:px-8 max-w-4xl">
        </div>
      </div>
    </div>
  </main>

  <!-- Footer med tema-toggle -->
  <footer class="py-4 mt-auto">
    <div class="max-w-7xl mx-auto px-4 flex items-center justify-between text-sm text-stone-500">
      <span>Tour de France 2026</span>
      <div class="flex items-center gap-2">
        <span class="text-xs" aria-hidden="true">☀️</span>
        <label class="theme-switch">
          <input type="checkbox" id="theme-toggle" aria-label="Bytt mellom lyst og mørkt tema">
          <span class="theme-track" aria-hidden="true">
            <span class="theme-thumb"></span>
          </span>
        </label>
        <span class="text-xs" aria-hidden="true">🌙</span>
      </div>
    </div>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
